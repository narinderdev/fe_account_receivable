<div class="set-password-container">
  <form class="set-password-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2 class="title">Set Your Password</h2>
    <p class="subtitle">Create your password to complete your setup.</p>

    <!-- Show email being used -->
    <div class="email-info" *ngIf="email">
      <small
        >Setting password for: <strong>{{ email }}</strong></small
      >
    </div>

    <!-- Global error message -->
    <div class="error global-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-field password-group">
      <label>Password <span class="color">*</span></label>
      <div class="password-section">
        <div class="password-field">
          <div class="input-wrapper">
            <input
              [attr.aria-describedby]="passwordRulesHelperId"
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              placeholder="Create a password"
              autocomplete="new-password"
              (focus)="onPasswordFocus()"
              (blur)="onPasswordBlur()"
              (input)="onPasswordInput($any($event.target).value)"
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility('password')"
              [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="passwordVisible"
            >
              <img [src]="passwordVisible ? 'show.svg' : 'eye.svg'" alt="" />
            </button>
          </div>
          <div class="error" *ngIf="submitted && form.get('password')?.errors">
            <span *ngIf="form.get('password')?.hasError('required')">Password is required.</span>
            <span *ngIf="form.get('password')?.hasError('passwordComplexity')">
              Password must be at least 12 characters and include uppercase, lowercase, and special characters.
            </span>
          </div>
        </div>

        <app-password-rules
          class="password-checklist"
          [rules]="passwordRules"
          [visible]="showPasswordRules"
          [helperId]="passwordRulesHelperId"
        ></app-password-rules>
      </div>
    </div>

    <div class="form-field">
      <label>Confirm Password <span class="color">*</span></label>
      <div class="input-wrapper">
        <input
          [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="password-toggle-btn"
          (click)="togglePasswordVisibility('confirmPassword')"
          [attr.aria-label]="confirmPasswordVisible ? 'Hide confirm password' : 'Show confirm password'"
          [attr.aria-pressed]="confirmPasswordVisible"
        >
          <img [src]="confirmPasswordVisible ? 'show.svg' : 'eye.svg'" alt="" />
        </button>
      </div>
      <div class="error" *ngIf="submitted && form.get('confirmPassword')?.errors">
        Confirm Password is required.
      </div>
      <div class="error" *ngIf="submitted && form.errors?.['mismatch']">
        Passwords do not match.
      </div>
    </div>

    <button class="btn-primary" type="submit" [disabled]="loading || !email">
      <app-spinner *ngIf="loading"></app-spinner>
      <span *ngIf="!loading">Save Password</span>
    </button>
  </form>
</div>
