<div class="change-password-container">
  <form class="change-password-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2 class="title">Change Password</h2>
    <p class="subtitle">Update your password to keep your account secure.</p>

    <div class="email-info" *ngIf="email">
      <small>Signed in as: <strong>{{ email }}</strong></small>
    </div>

    <div class="error global-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-field">
      <label>Current Password <span class="color">*</span></label>
      <div class="input-wrapper">
        <input
          [type]="oldPasswordVisible ? 'text' : 'password'"
          formControlName="oldPassword"
          placeholder="Enter current password"
        />
        <img
          [src]="oldPasswordVisible ? 'show.svg' : 'eye.svg'"
          class="input-icon password-toggle"
          (click)="toggleVisibility('old')"
          alt="Toggle current password visibility"
        />
      </div>
      <div class="error" *ngIf="submitted && form.get('oldPassword')?.errors">
        Current password is required.
      </div>
    </div>

    <div class="form-field password-group">
      <label>New Password <span class="color">*</span></label>
      <div class="password-section">
        <div class="password-field">
          <div class="input-wrapper">
            <input
              [type]="newPasswordVisible ? 'text' : 'password'"
              formControlName="newPassword"
              placeholder="Enter new password"
              (focus)="onPasswordFocus()"
              (blur)="onPasswordBlur()"
              (input)="onPasswordInput($event.target.value)"
              [attr.aria-describedby]="passwordRulesHelperId"
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="toggleVisibility('new')"
              [attr.aria-label]="newPasswordVisible ? 'Hide new password' : 'Show new password'"
              [attr.aria-pressed]="newPasswordVisible"
            >
              <img [src]="newPasswordVisible ? 'show.svg' : 'eye.svg'" alt="" />
            </button>
          </div>
          <div class="error" *ngIf="submitted && form.get('newPassword')?.errors">
            <span *ngIf="form.get('newPassword')?.hasError('required')">New password is required.</span>
            <span *ngIf="form.get('newPassword')?.hasError('passwordComplexity')">
              Please meet all password requirements.
            </span>
          </div>
        </div>

        <app-password-rules
          class="password-checklist"
          [rules]="passwordRules"
          [visible]="showPasswordRules"
          [helperId]="passwordRulesHelperId"
        ></app-password-rules>
      </div>
    </div>

    <div class="form-field">
      <label>Confirm Password <span class="color">*</span></label>
      <div class="input-wrapper">
        <input
          [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm new password"
        />
        <img
          [src]="confirmPasswordVisible ? 'show.svg' : 'eye.svg'"
          class="input-icon password-toggle"
          (click)="toggleVisibility('confirm')"
          alt="Toggle confirm password visibility"
        />
      </div>
      <div class="error" *ngIf="submitted && form.get('confirmPassword')?.errors">
        Confirmation password is required.
      </div>
      <div class="error" *ngIf="submitted && form.errors?.['mismatch']">
        Passwords do not match.
      </div>
    </div>

  <button class="btn-primary" type="submit" [disabled]="loading">
    <app-spinner *ngIf="loading"></app-spinner>
    <span *ngIf="!loading">Update Password</span>
  </button>
  </form>
</div>
