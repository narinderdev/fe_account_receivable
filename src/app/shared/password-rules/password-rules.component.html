<div
  class="password-rules-card"
  *ngIf="visible"
  [attr.id]="helperId || null"
  role="status"
  aria-live="polite"
>
  <p class="password-rules-title">Password must include:</p>

  <ul class="password-rules-list">
    <li
      *ngFor="let rule of rules; trackBy: trackByRuleKey"
      class="password-rule"
      [class.password-rule--met]="rule.met"
      [attr.data-met]="rule.met"
    >
      <span class="password-rule-indicator" aria-hidden="true"></span>
      <span class="password-rule-text">{{ rule.label }}</span>
      <span class="sr-only">{{ rule.met ? 'Complete' : 'Incomplete' }}</span>
    </li>
  </ul>
</div>
